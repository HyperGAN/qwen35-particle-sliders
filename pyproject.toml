[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen35-particle-sliders"
version = "0.1.0"
description = "Qwen3.5 particle teachers, distilled weight edits, and Delta League experiments"
requires-python = ">=3.12"
dependencies = [
  "deltaleague[local]==0.1.1",
  "meta-glimmer-particle-slider[legacy] @ git+https://github.com/mikkel/meta-glimmer-particle-slider.git@80f22afd04d0794c1408c0058ec2b5f674a27b03",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
eval = ["lm-eval==0.4.13", "datasets>=4,<6"]

[project.scripts]
qwen35-slider = "qwen35_sliders.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
